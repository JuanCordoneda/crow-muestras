<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu carta · Le Comptoir du Pérou</title>
<meta name="theme-color" content="#141210">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27%3E%3Crect width=%2748%27 height=%2748%27 rx=%2710%27 fill=%27%23141210%27/%3E%3Ccircle cx=%2724%27 cy=%2724%27 r=%278%27 fill=%27%23c9a24a%27/%3E%3C/svg%3E">
<!--
  Página interna del Comptoir (demo): cambian precios, platos y fotos de la carta desde el celular.
  Lee la carta de ../carte.js y guarda la versión editada en localStorage ("comptoir-carte"), que la
  web lee al cargar y al cambiar (evento storage). Los cambios solo existen en este navegador: la
  versión de verdad los guardará en el servidor, con clave de acceso.
-->
<style>
@font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:500 700;font-display:swap;src:url(../fonts/cormorant-garamond-latin.woff2) format("woff2")}
@font-face{font-family:"DM Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(../fonts/dm-sans-latin.woff2) format("woff2")}
:root{
  --ink:#141210; --ink-3:#3b342d; --cream:#f6efe2; --cream-2:#ede3d0; --white:#fffbf4;
  --gold:#c9a24a; --gold-l:#e3c67e; --gold-d:#8a6b22; --red:#b4322b; --green:#3d7a4a;
  --line:rgba(20,18,16,.12); --muted:#6b6157; --r:16px;
  --f-display:"Cormorant Garamond",Garamond,"Times New Roman",serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

.top{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--white);padding:calc(12px + env(safe-area-inset-top)) 0 0}
.top .wrap{display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand small{display:block;color:var(--gold-l);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase}
.brand b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.see{display:inline-flex;align-items:center;gap:6px;flex:none;background:var(--gold);color:var(--ink);text-decoration:none;font-weight:700;font-size:.92rem;padding:10px 14px;border-radius:999px}
.see svg{width:15px;height:15px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;margin:0 auto;max-width:720px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;color:var(--white);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,251,244,.22);border-radius:999px}
.cats a:active{background:rgba(255,251,244,.12)}

.demo{margin:16px 0 4px;padding:12px 14px;border-radius:12px;background:var(--cream-2);font-size:.9rem;color:var(--ink-3)}
.demo b{color:var(--ink)}

.cat{scroll-margin-top:130px;margin-top:26px}
.cat h2{font-family:var(--f-display);font-weight:600;font-size:2rem;line-height:1;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.cat h2 small{font-family:var(--f-body);font-size:.85rem;font-weight:400;color:var(--muted)}
.list{display:grid;gap:10px}

.dish{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:12px;transition:opacity .2s}
.dish.off{opacity:.55}
.row{display:flex;align-items:center;gap:12px}
.pic{flex:none;width:58px;height:58px;border-radius:12px;border:0;padding:0;overflow:hidden;background:var(--cream-2);display:grid;place-items:center;color:var(--gold-d);position:relative}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic svg{width:22px;height:22px}
.name{flex:1;min-width:0}
.name b{display:block;font-weight:700;line-height:1.25}
.name span{display:block;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{flex:none;display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--cream);padding:0 10px 0 0;transition:border-color .15s}
.price:focus-within{border-color:var(--gold)}
.price input{width:4.2ch;border:0;background:none;padding:10px 4px 10px 10px;text-align:right;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums;outline:0}
.price i{font-style:normal;font-weight:700;color:var(--muted)}
.price.bad{border-color:var(--red)}

.tools{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:.86rem}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="true"].star{background:var(--ink);color:var(--gold-l);border-color:var(--ink)}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;margin-right:auto;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:#cfc5b4;position:relative;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(18px)}

.more{display:grid;gap:12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.more[hidden]{display:none}
.more label{display:grid;gap:4px;font-size:.82rem;color:var(--muted)}
.more input,.more textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--cream);padding:10px 12px;font-size:1rem;color:var(--ink)}
.more input:focus,.more textarea:focus{border-color:var(--gold);outline:0}
.more textarea{min-height:68px;resize:vertical}
.more .acts{display:flex;gap:8px;flex-wrap:wrap}
.danger{color:var(--red);border-color:rgba(180,50,43,.35)}

.add{width:100%;margin-top:10px;border:1.5px dashed rgba(20,18,16,.25);background:none;border-radius:var(--r);padding:14px;font-weight:700;color:var(--gold-d)}

.reset{display:block;margin:40px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.88rem}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:var(--ink);color:var(--white);padding:12px 18px;border-radius:999px;font-size:.92rem;display:flex;align-items:center;gap:8px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);transition:transform .25s,visibility .25s;z-index:10;white-space:nowrap}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast svg{width:16px;height:16px;color:var(--gold-l)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-cam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
</svg>

<header class="top">
  <div class="wrap">
    <div class="brand"><small>Página interna</small><b>Le Comptoir du Pérou</b></div>
    <a class="see" href="../#carte" target="comptoir-web">Ver la web <svg><use href="#i-out"/></svg></a>
  </div>
  <nav class="cats" id="cats" aria-label="Categorías"></nav>
</header>

<main class="wrap">
  <p class="demo"><b>Tu carta.</b> Tocá un precio y cambialo: se guarda solo y ya se ve en la web. Con el interruptor sacás un plato que se terminó, sin borrarlo.</p>
  <div id="menu"></div>
  <button class="reset" id="reset" type="button">Volver a la carta original</button>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><svg><use href="#i-ok"/></svg><span>Guardado: ya se ve en la web</span></div>
<input type="file" id="file" accept="image/*" class="vh" tabindex="-1" aria-hidden="true">

<script src="../carte.js"></script>
<script>
(function(){
"use strict";
var KEY = "comptoir-carte";
var base = window.COMPTOIR_CARTE.menu;
var menu = load();
var open = {};          // platos con el panel de edición abierto
var photoFor = null;    // plato que espera una foto

function copy(x){return JSON.parse(JSON.stringify(x));}
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.menu)return s.menu;}catch(_){}
  return copy(base);
}
var toastT;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,at:Date.now(),menu:menu}));}
  catch(e){alert("No entra en la memoria de este teléfono. Probá con una foto más chica.");return false;}
  var t=document.getElementById("toast");t.classList.add("on");
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},1800);
  return true;
}
// los textos de la carta pueden venir en tres idiomas: acá se edita el francés, que es el de la web
function fr(x){return x&&typeof x==="object"?(x.fr||""):(x||"");}
function euro(n){return (Math.round(n*100)/100).toFixed(n%1?2:0).replace(".",",");}
function parsePrice(s){var n=parseFloat(String(s).replace(",",".").replace(/[^\d.]/g,""));return isFinite(n)&&n>=0&&n<1000?Math.round(n*100)/100:null;}
function isData(n){return /^data:/.test(n||"");}
function imgSrc(n){return isData(n)?n:"../img/comptoir/"+n+"-800.webp";}
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  for(var k in attrs||{}){var v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}
  (kids||[]).forEach(function(c){if(c)e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}
function icon(id){var ns="http://www.w3.org/2000/svg",s=document.createElementNS(ns,"svg"),u=document.createElementNS(ns,"use");u.setAttribute("href","#"+id);s.appendChild(u);s.setAttribute("aria-hidden","true");return s;}
function find(id){for(var i=0;i<menu.length;i++)for(var j=0;j<menu[i].items.length;j++)if(menu[i].items[j].id===id)return {cat:menu[i],it:menu[i].items[j],k:j};}

function render(){
  var nav=document.getElementById("cats"),box=document.getElementById("menu");
  nav.innerHTML="";box.innerHTML="";
  menu.forEach(function(c){
    nav.appendChild(el("a",{href:"#c-"+c.id,text:fr(c.name)}));
    var on=c.items.filter(function(it){return !it.off;}).length;
    var sec=el("section",{class:"cat",id:"c-"+c.id},[
      el("h2",{},[fr(c.name),el("small",{text:on+" en la carta"})])
    ]);
    var list=el("div",{class:"list"});
    c.items.forEach(function(it){list.appendChild(card(it));});
    sec.appendChild(list);
    sec.appendChild(el("button",{class:"add",type:"button",text:"+ Agregar plato en "+fr(c.name),onclick:function(){addDish(c);}}));
    box.appendChild(sec);
  });
}

function card(it){
  var d=el("article",{class:"dish"+(it.off?" off":""),"data-id":it.id});
  var pic=el("button",{class:"pic",type:"button","aria-label":"Cambiar la foto de "+fr(it.n),onclick:function(){pickPhoto(it.id);}},
    [it.img?el("img",{src:imgSrc(it.img),alt:""}):icon("i-cam")]);
  var nameBox=el("div",{class:"name"},[el("b",{text:fr(it.n)||"Sin nombre"}),fr(it.d)?el("span",{text:fr(it.d)}):null]);
  var price=el("input",{type:"text",inputmode:"decimal",value:euro(it.p||0),"aria-label":"Precio de "+fr(it.n)+" en euros",enterkeyhint:"done"});
  var priceBox=el("label",{class:"price"},[price,el("i",{text:"€"})]);
  price.addEventListener("focus",function(){price.select();});
  price.addEventListener("input",function(){
    var n=parsePrice(price.value);priceBox.classList.toggle("bad",n===null);
    if(n!==null&&n!==it.p){it.p=n;save();}
  });
  price.addEventListener("blur",function(){price.value=euro(it.p||0);priceBox.classList.remove("bad");});
  price.addEventListener("keydown",function(e){if(e.key==="Enter")price.blur();});
  d.appendChild(el("div",{class:"row"},[pic,nameBox,priceBox]));

  var sw=el("input",{type:"checkbox",role:"switch"});sw.checked=!it.off;
  sw.addEventListener("change",function(){if(sw.checked)delete it.off;else it.off=true;d.classList.toggle("off",!!it.off);save();render();});
  var star=el("button",{class:"chip star",type:"button","aria-pressed":String(it.tag==="fav"),onclick:function(){
    var was=it.tag==="fav";menu.forEach(function(c){c.items.forEach(function(x){if(x.tag==="fav")delete x.tag;});});
    if(!was)it.tag="fav";save();render();
  }},[icon("i-star"),"Destacado"]);
  var edit=el("button",{class:"chip",type:"button","aria-expanded":String(!!open[it.id]),onclick:function(){open[it.id]=!open[it.id];render();if(open[it.id])focusName(it.id);}},[icon("i-pen"),"Editar"]);
  d.appendChild(el("div",{class:"tools"},[el("label",{class:"switch"},[sw,it.off?"Agotado, no se ve":"En la carta"]),star,edit]));

  if(open[it.id]){
    var nIn=el("input",{type:"text",value:fr(it.n),"data-name":"1"});
    nIn.addEventListener("change",function(){var v=nIn.value.trim();if(v){it.n=v;save();render();}});
    var dIn=el("textarea",{rows:"2"});dIn.value=fr(it.d);
    dIn.addEventListener("change",function(){var v=dIn.value.trim();if(v)it.d=v;else delete it.d;save();render();});
    d.appendChild(el("div",{class:"more"},[
      el("label",{},["Nombre del plato",nIn]),
      el("label",{},["Descripción (opcional)",dIn]),
      el("div",{class:"acts"},[
        el("button",{class:"chip",type:"button",onclick:function(){pickPhoto(it.id);}},[icon("i-cam"),it.img?"Cambiar foto":"Agregar foto"]),
        it.img?el("button",{class:"chip",type:"button",text:"Quitar foto",onclick:function(){delete it.img;save();render();}}):null,
        el("button",{class:"chip danger",type:"button",text:"Borrar plato",onclick:function(){
          if(!confirm("¿Borrar «"+fr(it.n)+"» de la carta?"))return;
          var f=find(it.id);f.cat.items.splice(f.k,1);save();render();
        }})
      ])
    ]));
  }
  return d;
}
function focusName(id){var i=document.querySelector('[data-id="'+id+'"] [data-name]');if(i){i.focus();i.select();}}

function addDish(c){
  var it={id:"nuevo-"+Date.now(),n:"Nuevo plato",p:0};
  c.items.push(it);open[it.id]=true;save();render();
  var card=document.querySelector('[data-id="'+it.id+'"]');card.scrollIntoView({block:"center",behavior:"smooth"});focusName(it.id);
}

/* fotos: se achican en el teléfono antes de guardarlas (1000 px, JPEG) */
var file=document.getElementById("file");
function pickPhoto(id){photoFor=id;file.value="";file.click();}
file.addEventListener("change",function(){
  var f=file.files&&file.files[0],id=photoFor;if(!f||!id)return;
  var url=URL.createObjectURL(f),img=new Image();
  img.onload=function(){
    var max=1000,s=Math.min(1,max/Math.max(img.width,img.height));
    var cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    var it=find(id).it,prev=it.img;it.img=cv.toDataURL("image/jpeg",.82);
    if(!save()){if(prev)it.img=prev;else delete it.img;}
    render();
  };
  img.onerror=function(){URL.revokeObjectURL(url);alert("No se pudo abrir esa imagen.");};
  img.src=url;
});

document.getElementById("reset").addEventListener("click",function(){
  if(!confirm("¿Volver a la carta original? Se pierden los cambios hechos acá."))return;
  try{localStorage.removeItem(KEY);}catch(_){}
  menu=copy(base);open={};render();window.scrollTo(0,0);
});
// si la carta cambia en otra pestaña, se recarga acá también
window.addEventListener("storage",function(e){if(e.key===KEY||e.key===null){menu=load();render();}});

render();
})();
</script>
</body>
</html>
