<!doctype html>
<!-- Miniatura para WhatsApp / redes (1200×630). Se renderiza con build-og.sh → ../og.jpg -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../base.css">
<style>
html,body{width:1200px;height:630px;overflow:hidden;background:#faf5ef;color:#2f241f}
.card{position:relative;width:1200px;height:630px;padding:84px 90px;background:radial-gradient(90% 90% at 100% 0%,#f0e2d3 0%,transparent 65%),#faf5ef}
svg{position:absolute;top:0;right:-20px;width:560px;height:630px;color:#c39a5f;opacity:.6;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%)}
.where{margin:0 0 26px;font:600 20px/1 Inter,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#7e4f30}
h1{position:relative;margin:0;font:600 124px/.9 "Cormorant Garamond",Georgia,serif;letter-spacing:-.02em}
h1 em{display:block;margin-top:14px;font-size:62px;font-weight:500;color:#a36b45}
.pill{position:absolute;left:90px;bottom:80px;display:inline-flex;align-items:center;gap:14px;padding:16px 28px;border-radius:999px;background:#7e4f30;color:#fffaf4;font:600 24px/1 Inter,sans-serif}
.pill span{color:#e8c27a;letter-spacing:3px}
</style>
</head>
<body>
<div class="card">
  <svg id="s" viewBox="0 0 400 640" preserveAspectRatio="xMaxYMid slice"></svg>
  <p class="where">Passy · Paris 16e</p>
  <h1>Lissage<br>brésilien<em>by Reijane</em></h1>
  <div class="pill"><span>★★★★★</span> 5,0 · 179 avis Google · Réservez sur WhatsApp</div>
</div>
<script>
var out='';
for(var i=0;i<22;i++){var x0=30+i*16.5,d='',ph=i*.55,amp=9+(i%4)*3;for(var y=-10;y<=650;y+=8){var k=Math.max(0,1-(y+10)/430),x=x0+amp*k*k*Math.sin(y/26+ph)+(1-k)*i*.6;d+=(y<0?'M':'L')+x.toFixed(1)+' '+y}out+='<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="'+(i%3?1:1.6)+'" stroke-linecap="round" opacity="'+(.35+(i%5)*.13).toFixed(2)+'"/>'}
document.getElementById('s').innerHTML=out;
</script>
</body>
</html>
