<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;font-weight:500 700;src:url(../fonts/Fraunces-500-700-latin.woff2)}
@font-face{font-family:Fraunces;font-style:italic;font-weight:500 700;src:url(../fonts/Fraunces-500-700-italic-latin.woff2)}
@font-face{font-family:Manrope;font-weight:400 800;src:url(../fonts/Manrope-400-800-latin.woff2)}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:#1a1310;color:#f6eee2;font-family:Manrope,sans-serif;isolation:isolate}
body::before{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(90% 75% at 78% 120%,rgba(224,102,47,.9) 0%,rgba(185,72,27,.5) 30%,rgba(110,34,51,.2) 58%,transparent 76%),radial-gradient(50% 50% at 0% 0%,rgba(110,34,51,.5),transparent 70%)}
body::after{content:"";position:absolute;left:0;right:0;bottom:0;height:50%;z-index:-1;opacity:.22;background:repeating-linear-gradient(90deg,transparent 0 40px,#000 40px 46px);-webkit-mask:linear-gradient(transparent,#000 60%)}
.wrap{position:absolute;left:80px;top:78px;right:80px}
.brand{display:flex;align-items:center;gap:18px;font:600 50px/1 Fraunces,serif}
.brand svg{width:78px;color:#e0662f}
h1{margin:52px 0 0;font:600 84px/1.02 Fraunces,serif;letter-spacing:-.02em;max-width:820px}
h1 em{font-style:italic;font-weight:500;color:#f4a25b}
.sub{margin-top:30px;font-size:27px;color:#e8d9c8}
.wa{position:absolute;right:80px;top:84px;display:flex;align-items:center;gap:12px;background:#25d366;color:#05361a;font-weight:800;font-size:24px;padding:16px 24px;border-radius:16px}
.empa{position:absolute;right:70px;bottom:60px;width:300px;color:#e0662f;opacity:.95}
</style></head><body>
<div class="wrap">
  <div class="brand"><svg data-empanada viewBox="0 0 120 72"></svg>Pangus</div>
  <h1>La braise, l'empanada <em>et le Malbec.</em></h1>
  <div class="sub">Cuisine argentine · 11 rue de l'Étoile, Paris 17e · ★ 4,7</div>
</div>
<div class="wa">Réserver sur WhatsApp</div>
<svg class="empa" data-empanada viewBox="0 0 120 72"></svg>
<script>
const cx=60,cy=64,r=50,n=13;let b='';for(let i=0;i<=n;i++){const a=Math.PI-Math.PI*i/n;b+=`<circle cx="${cx+r*Math.cos(a)}" cy="${cy-r*Math.sin(a)}" r="6.4"/>`}
const g=`<g fill="currentColor"><path d="M10 64 A50 50 0 0 1 110 64 Z"/>${b}</g><path d="M22 64 A38 38 0 0 1 98 64" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="3" stroke-linecap="round"/>`
document.querySelectorAll('[data-empanada]').forEach(s=>s.innerHTML=g)
</script>
</body></html>
