<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sculpt Detox Ibiza | Drenaje linfático, maderoterapia y lipedema</title>
    <meta name="description" content="Remodelación corporal sin cirugía en Ibiza: drenaje linfático brasileño, maderoterapia, tratamiento de lipedema y post-operatorio. Reserva por WhatsApp." />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!--
      La barra del navegador en la arena de la marca. Solo tema claro: la web está pensada sobre
      arena y salvia, y sin esto algunos Android la oscurecen por su cuenta y la dejan irreconocible.
      Sin `format-detection telephone=no`: aquí el teléfono tiene que poder tocarse.
    -->
    <meta name="theme-color" content="#efe6dc" />
    <meta name="color-scheme" content="light only" />
    <meta name="application-name" content="Sculpt Detox" />
    <meta name="apple-mobile-web-app-title" content="Sculpt Detox" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link id="canonical" rel="canonical" href="https://sculptdetox.com/" />

    <!--
      Lo que ven WhatsApp, Instagram y Facebook al compartir el enlace. Ninguno ejecuta JavaScript:
      tiene que estar escrito aquí tal cual. `scripts/pages.mjs` lo ajusta para cada página e idioma.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sculpt Detox" />
    <meta property="og:title" content="Sculpt Detox Ibiza | Drenaje linfático, maderoterapia y lipedema" />
    <meta property="og:description" content="Remodelación corporal sin cirugía en Ibiza: drenaje linfático brasileño, maderoterapia, tratamiento de lipedema y post-operatorio. Reserva por WhatsApp." />
    <meta id="og-url" property="og:url" content="https://sculptdetox.com/" />
    <meta property="og:image" content="https://sculptdetox.com/og.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sculpt Detox, remodelación corporal sin cirugía en Ibiza, con Michele Costa en su cabina" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sculpt Detox Ibiza | Drenaje linfático, maderoterapia y lipedema" />
    <meta name="twitter:description" content="Remodelación corporal sin cirugía en Ibiza: drenaje linfático brasileño, maderoterapia, tratamiento de lipedema y post-operatorio. Reserva por WhatsApp." />
    <meta name="twitter:image" content="https://sculptdetox.com/og.jpg?v=1" />

    <!--
      Solo se precarga lo que pinta el primer pantallazo: el texto y los titulares. La cursiva
      llega cuando hace falta. Ni una petición a terceros: cada dominio nuevo es un segundo más
      en blanco con la cobertura de la playa.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Manrope-400-800-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/CormorantGaramond-500-600-latin.woff2" crossorigin />

    <!--
      La foto de la portada: es lo más grande del primer pantallazo (el LCP) y, precargada, llega
      a la vez que el CSS. Solo en la portada: `scripts/pages.mjs` la quita de las demás páginas.
    -->
    <link
      rel="preload"
      as="image"
      href="/img/sculptdetox/michele-costa-retrato.webp"
      imagesrcset="/img/sculptdetox/michele-costa-retrato-480.webp 480w, /img/sculptdetox/michele-costa-retrato-720.webp 720w, /img/sculptdetox/michele-costa-retrato-900.webp 900w, /img/sculptdetox/michele-costa-retrato.webp 1200w"
      imagesizes="(min-width: 1024px) 46vw, 100vw"
      fetchpriority="high"
    />

    <!-- La ficha de Google (schema.org) la escribe `scripts/pages.mjs` para cada página e idioma. -->
    <!--jsonld-->
  </head>
  <body>
    <!-- El contenido de cada página lo escribe el build (`scripts/pages.mjs`); en `npm run dev` llega vacío. -->
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
