<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Post 2 · Lissage brésilien</title><link rel="stylesheet" href="posts.css">
<style>
.post{padding:84px 80px 70px;display:flex;flex-direction:column}
.eyebrow{color:var(--terra-d)}
h1{margin:26px 0 0;font-size:96px;line-height:.95}
h1 em{font-style:italic;color:var(--terra)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:52px 0 0;position:relative}
.pair .ph{aspect-ratio:4/5.9}
.pair .tag{left:26px;top:26px}
.pair .ph.after{background:linear-gradient(160deg,#f7ede7,#ecd8cd)}
.arrow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font-size:40px;z-index:3;box-shadow:0 0 0 10px var(--creme)}
.chips{display:flex;gap:14px;margin-top:40px}
.chips span{font-size:23px;padding:12px 24px;border-radius:999px;background:var(--nude);color:var(--terra-d);font-weight:500}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.foot .cta{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-d);font-weight:600;text-align:right;line-height:1.5}
</style></head>
<body><div class="post">
  <span class="eyebrow">Lissage brésilien</span>
  <h1 class="serif">Cheveux lisses, <em>doux et légers</em></h1>
  <div class="pair">
    <div class="ph empty"><span class="tag">Avant</span><div class="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo avant</div></div>
    <div class="ph empty after"><span class="tag">Après</span><div class="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo après</div></div>
    <span class="arrow">→</span>
  </div>
  <div class="chips"><span>Sans frisottis</span><span>Brillance</span><span>Toucher soyeux</span></div>
  <div class="foot">
    <div class="brand"><span class="mono" data-brand="mono">LTB</span><div><b data-brand="logo">LTB <span class="script">Concept</span></b><small data-brand="tagline">by La Touche Brésilienne</small></div></div>
    <div class="cta">Réservez sur WhatsApp<br>Paris 5e · Clichy</div>
  </div>
</div>
<script src="../config.js"></script><script src="brand.js"></script></body></html>
