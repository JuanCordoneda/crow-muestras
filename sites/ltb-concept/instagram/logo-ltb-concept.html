<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Logo provisoire · LTB Concept</title><link rel="stylesheet" href="posts.css">
<style>
/* Logo tipográfico provisorio (también sirve de foto de perfil de Instagram: 1080 × 1080, se recorta en círculo) */
.post{width:1080px;height:1080px;background:var(--terra);color:#fff;display:grid;place-content:center;text-align:center;border-radius:0}
.post::before{content:"";position:absolute;inset:70px;border-radius:50%;border:2px solid rgba(255,255,255,.45)}
b{font:600 300px/.8 "Cormorant Garamond",serif;letter-spacing:.06em;display:block}
.script{font-size:190px;line-height:1;display:block;margin-top:-10px}
small{display:block;font-size:30px;letter-spacing:.3em;text-transform:uppercase;margin-top:26px;opacity:.9}
</style></head>
<body><div class="post"><div><b data-brand="mono">LTB</b><span class="script" data-brand="rest">Concept</span><small data-brand="tagline">by La Touche Brésilienne</small></div></div>
<script src="../config.js"></script><script src="brand.js"></script></body></html>
