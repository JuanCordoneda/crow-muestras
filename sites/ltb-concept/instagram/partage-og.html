<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Aperçu de partage (og.jpg)</title><link rel="stylesheet" href="posts.css">
<style>
/* Lo que se ve al compartir el enlace en WhatsApp, Facebook o iMessage: se exporta a ../og.jpg (1200 × 630) */
.post{width:1200px;height:630px;display:grid;grid-template-columns:500px 1fr;background:var(--terra);color:#fff}
.photo{position:relative;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:62% 30%}
.txt{padding:64px 70px;display:flex;flex-direction:column;background:radial-gradient(120% 120% at 100% 0%,#d6a090,#b9786a 50%,#8a5143)}
.seal{display:flex;align-items:center;gap:22px}
.seal .mono{width:92px;height:92px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);display:grid;place-items:center;font:600 30px "Cormorant Garamond",serif;letter-spacing:.08em}
.seal b{display:block;font:600 46px/1 "Cormorant Garamond",serif}
.seal b .script{font-size:1.2em}
.seal small{display:block;font-size:15px;letter-spacing:.26em;text-transform:uppercase;margin-top:8px;opacity:.85}
h1{margin:auto 0 0;font-size:66px;line-height:.98}
h1 em{font-style:italic;color:#fff3ea}
p{margin:18px 0 0;font-size:19px;letter-spacing:.1em;text-transform:uppercase;opacity:.92;white-space:nowrap}
</style></head>
<body><div class="post">
  <div class="photo"><img src="../img/hero-brune-1400.webp" alt=""></div>
  <div class="txt">
    <div class="seal"><span class="mono" data-brand="mono">LTB</span><div><b data-brand="logo">LTB <span class="script">Concept</span></b><small data-brand="tagline">by La Touche Brésilienne</small></div></div>
    <h1 class="serif">L’expertise <em>brésilienne</em> au cœur de Paris</h1>
    <p>Paris 5e · Clichy · Réservez sur WhatsApp</p>
  </div>
</div>
<script src="../config.js"></script><script src="brand.js"></script></body></html>
