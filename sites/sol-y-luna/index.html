    <!--
      Solo se precarga lo que pinta el primer pantallazo: el cuerpo de texto y los titulares.
      La cursiva llega cuando hace falta. Ni una petición a terceros: en la calle con una rayita de
      cobertura, cada dominio nuevo es un segundo más en blanco.

    <!--
      La foto de la portada la pinta la app, así que el navegador no la ve en el HTML y la pedía dos
      segundos tarde: hasta entonces, azul liso. Precargada llega con el resto y el visitante ve el
      restaurante en cuanto se pinta. Es la foto de serie: si el panel pone otra en el primer hueco
      de la portada, esta precarga deja de servir para nada (unos kB de más en la primera visita, la
      web se ve igual). Si esa otra foto se queda, conviene traer aquí su dirección.
    -->
    <link
      rel="preload"
      as="image"
      href="/img/grupo/sol-interieur-lustre.webp"
      imagesrcset="/img/grupo/sol-interieur-lustre-480.webp 480w, /img/grupo/sol-interieur-lustre-900.webp 900w, /img/grupo/sol-interieur-lustre-1200.webp 1200w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!--
      La carta se pide aquí, antes del CSS: son 10 kB que no compiten con nada y quitan del camino
      un viaje entero al servidor. El panel pide la suya aparte, con contraseña y con lo oculto.
      `#/admin` es la dirección antigua con almohadilla, que el router sigue entendiendo.
    -->
    <script>
      // Bajo una subcarpeta (monorepo de muestras) no hay servidor: se pinta la carta empaquetada.
      if ('%BASE_URL%' === '/' && !/^\/admin(\/|$)/.test(location.pathname) && !/^#\/admin(\/|$)/.test(location.hash)) {
        window.__menu = fetch('/api/menu')
          .then(function (response) { return response.ok ? response.json() : null })
          .catch(function () { return null })
      }
    </script>

    <!--
      Pantalla de arranque en línea: se pinta con el HTML, antes de bajar el CSS y el JS.
      Nadie ve un blanco y nadie piensa que la web está rota. El sol del grupo sale al instante; la
      ruedita, solo si la carga pasa de un tercio de segundo. Georgia y no DM Serif: la tipografía
      de la marca aún no ha llegado y un hueco vacío donde va el nombre se ve peor.
    -->
    <style>

      #boot[hidden]{display:none}
      #boot.is-done{opacity:0;pointer-events:none}
      #boot svg{display:block;width:76px;height:76px;margin:0 0 2px}
      #boot strong{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:400;letter-spacing:-.3px}
      #boot strong em{color:#f2b632}
      #boot span{font-size:11px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,.74)}
      #boot i{display:block;width:32px;height:32px;margin-top:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.2);border-top-color:#f2b632;opacity:0;animation:boot-spin .8s linear infinite,boot-in .25s ease .35s forwards}
      #boot p{margin:10px 0 0;max-width:280px;font-size:14px;line-height:1.45;color:rgba(255,255,255,.86)}
      #boot p:empty{display:none}
      #boot button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:12px;padding:0 24px;border:0;border-radius:999px;background:#f2b632;color:#121a2e;font:inherit;font-size:15px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
      #boot button:focus-visible{outline:3px solid #fff;outline-offset:2px}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-in{to{opacity:1}}
      @media (prefers-reduced-motion:reduce){#boot i{animation:boot-in .25s ease .35s forwards}}
    </style>

    <!--
      El mismo index.html sirve todas las páginas, así que la dirección canónica se ajusta a la que
      se ha abierto: si no, Google entendería que la página de cada local es una copia de la portada y
      no la enseñaría. Cada idioma (`?lang=fr|es`) es canónico de sí mismo, como anuncia el
      sitemap; cualquier otro parámetro (`?source=pwa`, `?fbclid=`) se descarta. Una ruta
      desconocida pinta la portada y se queda con la portada como canónica.
      Va antes de pintar nada y no pesa ni un kilobyte.
    -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/'
        if (!/^\/(el-sol-la-luna|mexi-and-co|reserver|confidentialite)?$/.test(path)) return
        var lang = /[?&]lang=(es|fr)(?:&|$)/i.exec(location.search)
        var href = 'https://www.mexiandco.fr' + path + (lang ? '?lang=' + lang[1].toLowerCase() : '')
        var canonical = document.getElementById('canonical')
        var ogUrl = document.getElementById('og-url')
        if (canonical) canonical.setAttribute('href', href)
        if (ogUrl) ogUrl.setAttribute('content', href)
        if (lang) document.documentElement.lang = lang[1].toLowerCase()
      })()
    </script>

    <script>
      // Si algo va mal (red caída, chunk que no llega), el visitante recibe una salida en vez de
      // quedarse mirando una ruedita eterna. Un botón de verdad, de 44 px, que se acierta con el dedo.
      setTimeout(function () {
        var boot = document.getElementById('boot')
        if (!boot || boot.classList.contains('is-done')) return
        var message = boot.querySelector('p')
        var retry = document.createElement('button')
        retry.type = 'button'
        retry.textContent = 'Réessayer'
        retry.onclick = function () { location.reload() }
        message.textContent = 'Le chargement prend plus de temps que prévu. Vérifiez votre connexion et réessayez.'
        message.appendChild(document.createElement('br'))
        message.appendChild(retry)
      }, 12000)
